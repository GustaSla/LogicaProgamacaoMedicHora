<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedicHora | Seu aplicativo de saúde</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>
        <div class="cabecalho">
            <div>
                <h1>
                    <p>Calculadora de Dosagem Diaria<img src="img/icons8-pílula-30.png" alt="">
                </h1>
                </p>
            </div>
            <div class="subtitulo">
                <h2>Preencha as informações abaixo para calcular sua dosagem.</h2>
            </div>
        </div>

    </header>

    <div class="dados">
        <div class="nome">
            <form action="">
                <label for="nome">Nome do usuário</label>
                <input id="nome" type="text" placeholder="Digite seu nome" name="nome"  required>
            </form>
        </div>
        <div class="email">
            <form action="">
                <label for="name">E-mail</label>
                <input id="email" type="email" placeholder="exemplo@email.com" name="email" required>
            </form>
        </div>
        <div class="data">
            <form action="">
                <label for="data">Data</label>
                <input id="data" type="datetime-local" name="data" required>
            </form>
        </div>
    </div>

    <div class="medicamento">
        <div class="nome_med">
            <p>Medicamento</p>
            <div>
                <form action="">
                    <label for="name">Nome do medicamento</label>
                    <input type="text" placeholder="Digite o nome do medicamento" name="nome_med" id="nome_med"
                        required>
                </form>
            </div>
        </div>
        <div class="medicamento_p">
            <form action="">
                <label for="medicamento_p">Selecionar medicamento padrão</label>
                <input type="checkbox">
            </form>
        </div>
    </div>

    <div class="dosagem">
        <div class="dosagem_mg">
            <p>Dosagem</p>
            <form action="">Selecione a dosagem(mg)
                <input type="radio" id="250 mg" name="dosagem" value="250mg">
                <label for="250 mg">250 mg</label>
                <input type="radio" id="500 mg" name="dosagem" value="500mg">
                <label for="500 mg">500 mg</label>
                <input type="radio" id="750 mg" name="dosagem" value="750mg">
                <label for="750 mg">750 mg</label>
            </form>
        </div>
        <div class="quant">
            <label for="quant">Quantidade de doses por dia</label>
            <input type="number" id="qtd" min="0" max="120" placeholder="0" value="">
            <p>Número de vezes que você tomará por dia</p>
        </div>
    </div>

    <div class="btn">
        <button>Calcular dosagem diária </button>
    </div>

    <div class="resultado">
        <div class="check">
<img src="/img/icons8-selecionado-24.png" alt="">
        </div>
        <div resultado_escrito>
            <h2>Resultado</h2>
            <p>Você tomará 1.000mg por dia</p>
            </div>
    </div>
    <div class="calen">

    </div>
    </div>

<script src="js/app.js"></script>
<script src="js/logic.js"></script>

</body>

</html>
